name: Build APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP file
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" -not -path "./.git/*" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in the repository"
            exit 1
          fi
          echo "Found ZIP: $ZIP_FILE"
          mkdir -p /tmp/project
          unzip -o -q "$ZIP_FILE" -d /tmp/project

          SETTINGS=$(find /tmp/project -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts not found inside the ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project directory: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # build.gradle.kts expects debug.keystore in the project root
      - name: Create debug keystore
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          keytool -genkeypair -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MohammadOrd-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
